# 应用配置
spring:
  application:
    name: social-photo-booking-backend
  
  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/social_shoot?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: Kun0802
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # Redis配置
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
  
  # 消息队列配置
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.photo.booking.entity
  configuration:
    map-underscore-to-camel-case: true

# 服务器配置
server:
  port: 8081
  servlet:
    context-path: /

# JWT配置
jwt:
  secret: your-secret-key
  expire-time: 7200
  refresh-time: 86400

# 七牛云配置
qiniu:
  access-key: your-access-key
  secret-key: your-secret-key
  bucket: your-bucket-name
  domain: your-domain

# 微信小程序配置
wechat:
  app-id: your-app-id
  app-secret: your-app-secret
  mch-id: your-mch-id
  api-key: your-api-key

# 日志配置
logging:
  level:
    com.photo.booking: info
